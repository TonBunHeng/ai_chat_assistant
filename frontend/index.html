<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>AIChat_Support - AI Tourism Information Chatbot (Cambodia)</title>
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const resolvedTheme = theme === 'dark' || (!theme && prefersDark) ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', resolvedTheme === 'dark');
          document.documentElement.dataset.theme = resolvedTheme;
          document.documentElement.style.colorScheme = resolvedTheme;
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts: Inter & Kantumruy Pro (for Khmer language support) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#0F172A] text-[#0F172A] dark:text-slate-100 antialiased selection:bg-[#14B8A6] selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
